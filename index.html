<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="theme-color" content="#2c6b58">
<meta name="description" content="Ingresos, gastos, tarjeta, préstamos e inversiones. Funciona sin conexión.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: en el celular, una columna con navegación abajo para el pulgar; en la compu (≥960px), barra lateral y tablero en dos columnas */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#18232b; --muted:#5f6b72; --line:#dde1dc;
  --accent:#2c6b58; --accent-soft:#e1eee8; --on-accent:#ffffff;
  --good:#23794f; --bad:#b4442f; --warn:#a86b0b; --warn-soft:#fbf0dc; --bad-soft:#f8e4df;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171b; --surface:#1a2227; --ink:#e7ece9; --muted:#9aa7ad; --line:#2a353b;
    --accent:#6cc4a4; --accent-soft:#1d3a31; --on-accent:#0d1a15;
    --good:#5fcf94; --bad:#f08a72; --warn:#e8b04f; --warn-soft:#3a2f17; --bad-soft:#3d221c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171b; --surface:#1a2227; --ink:#e7ece9; --muted:#9aa7ad; --line:#2a353b;
  --accent:#6cc4a4; --accent-soft:#1d3a31; --on-accent:#0d1a15;
  --good:#5fcf94; --bad:#f08a72; --warn:#e8b04f; --warn-soft:#3a2f17; --bad-soft:#3d221c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px}
header.top h1{font-family:var(--font-display);font-size:22px;margin:0;letter-spacing:-.01em}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:0;padding:4px 0;cursor:default}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--warn)} .sync.off i{background:var(--bad)}
h2{font-family:var(--font-display);font-size:18px;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar .lbl{font-family:var(--font-display);font-size:20px;font-weight:600;text-transform:capitalize;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:18px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted)}
.tile.hl{background:var(--accent-soft);border-color:transparent}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .track{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar.over .fill{background:var(--bad)} .bar.near .fill{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.muted{background:var(--line);color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;background:var(--line);color:var(--muted)}
.item .ic.gasto{background:var(--bad-soft);color:var(--bad)} .item .ic.ingreso{background:var(--accent-soft);color:var(--good)}
.item .ic.transfer,.item .ic.pagotc{background:var(--line);color:var(--ink)} .item .ic.prestamo,.item .ic.cobro{background:var(--warn-soft);color:var(--warn)}
.item .txt{flex:1;min-width:0}
.item .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap .t2{white-space:normal}
.item .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.item .pend{font-size:11px;color:var(--warn);font-weight:500}
.kv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}.kv>span:last-child{text-align:right;margin-left:auto}
.daylbl{font-size:12px;color:var(--muted);font-weight:600;padding:12px 2px 2px;text-transform:capitalize}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:0}
input.in,select.in,textarea.in{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;color:var(--ink)}
input.big{font-family:var(--font-display);font-size:30px;font-weight:600;padding:8px 12px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:right;font-weight:600;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
.scroll{overflow-x:auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}
nav.bottom .in{display:flex;justify-content:space-around;align-items:center;max-width:760px;width:100%}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:10px;min-width:60px}
nav.bottom a svg{width:22px;height:22px;flex:none}
nav.bottom a[aria-current="page"]{color:var(--accent);font-weight:600}
nav.bottom .fab{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--on-accent);border:0;display:grid;place-items:center;cursor:pointer;margin-top:-18px;box-shadow:0 6px 18px rgba(20,60,45,.28)}
nav.bottom .fab svg{width:26px;height:26px}
nav.bottom .fab span{display:none}
nav.bottom .brand{display:none}
nav.bottom a.desk{display:none}
nav.bottom[hidden]{display:none!important}
body.anon #app{margin:0 auto!important;max-width:760px!important}
.overlay{position:fixed;inset:0;background:rgba(10,16,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
.svgchart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.menu a,.menu button.lnk{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border:0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500;background:none;width:100%;text-align:left;cursor:pointer}
.menu > :first-child{border-top:0}
.prog{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}
.prog b{display:block;height:100%;background:var(--accent)}
.dash{display:flex;flex-direction:column;gap:14px}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .logo{width:64px;height:64px;border-radius:18px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
code{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;overflow-wrap:anywhere}
/* Escritorio */
@media (min-width:960px){
  #app{max-width:1180px;margin:0 0 0 236px;padding:24px 32px 40px}
  nav.bottom{top:0;bottom:0;right:auto;width:220px;border-top:0;border-right:1px solid var(--line);padding:22px 14px;align-items:flex-start}
  nav.bottom .in{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px}
  nav.bottom .brand{order:-2;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px;padding:0 8px 18px}
  nav.bottom .brand img{width:30px;height:30px;border-radius:9px}
  nav.bottom a{flex-direction:row;font-size:14px;gap:12px;padding:10px 12px;min-width:0}
  nav.bottom a[aria-current="page"]{background:var(--accent-soft)}
  nav.bottom a.desk{display:flex}
  nav.bottom a.mob{display:none}
  nav.bottom .fab{order:-1;width:100%;height:auto;margin:0 0 14px;border-radius:12px;padding:11px 12px;display:flex;gap:8px;justify-content:center;box-shadow:none;font-weight:600}
  nav.bottom .fab svg{width:20px;height:20px}
  nav.bottom .fab span{display:inline}
  header.top h1{display:none}
  header.top{justify-content:flex-end;padding-top:0}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .dash{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
  .dash > .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Mis Finanzas</h1>
    <div id="sync" class="sync" role="status"><i></i><span>Cargando…</span></div>
  </header>
  <main id="view" class="stack"><div class="empty">Cargando…</div></main>
</div>
<nav class="bottom" id="nav" aria-label="Secciones" hidden>
  <div class="in">
    <div class="brand"><img src="icons/icon-192.png" alt="">Mis Finanzas</div>
    <a href="#resumen" data-v="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</a>
    <a href="#movimientos" data-v="movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</a>
    <button class="fab" id="fab" aria-label="Cargar movimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span>Nuevo movimiento</span></button>
    <a href="#tarjeta" data-v="tarjeta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>Tarjeta</a>
    <a href="#cierre" data-v="cierre" class="desk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Cierre de mes</a>
    <a href="#prestamos" data-v="prestamos" class="desk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Préstamos</a>
    <a href="#anual" data-v="anual" class="desk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>Resumen anual</a>
    <a href="#ajustes" data-v="ajustes" class="desk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Ajustes</a>
    <a href="#mas" data-v="mas" class="mob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</a>
  </div>
</nav>
<div id="modal"></div>
<script type="module" src="app.js"></script>
</body>
</html>
